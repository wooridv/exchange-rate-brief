name: 환율 브리핑

on:
  schedule:
    # 장중(평일) 20분마다 사이트/시간별 데이터 갱신. UTC 기준(KST-9).
    # 00:00~07:40 UTC = 09:00~16:40 KST. 잔디 발송은 brief.py 가 09/12/15시에만 1회.
    - cron: "*/20 0-7 * * 1-5"
  workflow_dispatch:
    inputs:
      send:
        description: "지금 잔디로도 발송(기본: 사이트만 배포)"
        required: false
        default: false
        type: boolean
      slot:
        description: "발송 시 슬롯"
        required: false
        default: "morning"
        type: choice
        options: [morning, lunch, afternoon]

permissions:
  pages: write
  id-token: write

concurrency:
  group: exchange-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 시간별(전시간 대비) 그래프용 누적 데이터. 실행 간 캐시로 유지(커밋 노이즈 방지).
      # 전일 대비 일별 데이터는 네이버에서 매번 전체 수집하므로 캐시와 무관.
      - name: 시간별 히스토리 복원/저장
        uses: actions/cache@v4
        with:
          path: data/history.jsonl
          key: fx-history-${{ github.run_id }}
          restore-keys: |
            fx-history-

      - name: 브리핑 실행
        env:
          JANDI_WEBHOOK_URL: ${{ secrets.JANDI_WEBHOOK_URL }}
          REPORT_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          HISTORY_DAYS: "60"
        run: |
          if [ "${{ github.event.inputs.send }}" = "true" ]; then
            python brief.py --out site --slot "${{ github.event.inputs.slot }}" --force
          else
            python brief.py --out site
          fi

      - name: 리포트 폴더 보장
        run: |
          mkdir -p site
          [ -f site/index.html ] || echo '<!doctype html><meta charset="utf-8"><p>아직 브리핑이 없습니다.</p>' > site/index.html

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: GitHub Pages 배포
        id: deploy
        uses: actions/deploy-pages@v4
